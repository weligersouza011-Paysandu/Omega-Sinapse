# =============================================================================
# Render Blueprint — Synapse (deploy unificado)
# Um único Web Service Node serve a API e o front-end React compilado em
# `frontend/dist`.
#
# Uso: no painel do Render, New + > Blueprint > aponte para este repositório.
# As variáveis marcadas com `sync: false` devem ser preenchidas no painel.
# =============================================================================

services:
  - type: web
    name: synapse-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: .
    # Instala as dependências do front-end (Vite) e gera o build em frontend/dist.
    buildCommand: npm install --include=dev && npm run build:frontend:install && npm run build
    # `migrate deploy` garante o schema atualizado antes de aceitar tráfego.
    startCommand: npm run prisma:deploy && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: synapse/orcamentos
      - key: UPLOAD_MAX_BYTES
        value: 10485760
      - key: UPLOAD_MAX_WIDTH
        value: 1920
      - key: UPLOAD_WEBP_QUALITY
        value: 80
